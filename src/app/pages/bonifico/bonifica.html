<div class="page">

  <app-navbar></app-navbar>

  <main class="content">

    <h1>Nuovo Bonifico</h1>

    <div class="form-card">

      <div class="form-group">

        <label>IBAN destinatario</label>

        <input
          type="text"
          placeholder="IT00X0000000000000000000000">

      </div>

      <div class="form-group">

        <label>Importo</label>

        <input
          type="number"
          step="0.01"
          placeholder="0.00">

      </div>

      <div class="form-group">

        <label>Causale</label>

        <textarea
          placeholder="Inserisci la causale">
        </textarea>

      </div>

      <button class="btn-primary">
        Effettua Bonifico
      </button>

    </div>

  </main>

</div>
